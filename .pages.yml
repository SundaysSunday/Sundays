media:
  input: public/images
  output: images
  categories: [ "image" ]
content:
  - name: events
    label: Events
    type: collection
    path: public/_events
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: url, label: Link, type: string }
      - { name: coverImage, label: Cover image, type: string }
      - { name: date, label: Date, type: string, required: true}
      - { name: address, label: Address, type: string, required: true}
  - name: gallery
    label: Gallery
    type: collection
    path: public/_gallery